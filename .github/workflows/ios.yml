name: iOS app

# Builds the WonderLab iPad/iPhone app on a Mac runner (Apple only allows iOS builds on macOS):
#  1. an iPad-simulator build that is launched and screenshotted (proof that it starts and renders), and
#  2. an unsigned WonderLab.ipa to install with Sideloadly / AltStore (signed there with your own Apple ID).
on:
  workflow_dispatch:
  push:
    branches: [ios-multiplatform]
    paths: ['android/**', 'ios/**', 'src/**', 'scripts/build-android-engine.mjs', '.github/workflows/ios.yml']

permissions:
  contents: write   # publishes build results/screenshots to the ci-ios-results branch

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        # Debug links in minutes (installable right away); Release is optimised but its link takes ~1 hour
        config: [Debug, Release]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }

      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: npm }

      - name: Install JS dependencies (the curriculum engine is bundled from ../src)
        run: npm ci --ignore-scripts

      - uses: gradle/actions/setup-gradle@v4

      - name: Cache Kotlin/Native toolchain
        uses: actions/cache@v4
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('android/gradle/libs.versions.toml') }}

      - name: Tools
        run: |
          brew install xcodegen
          chmod +x android/gradlew
          # the release iOS link needs far more than the 2 GB used on developer PCs
          sed -i '' 's/^org.gradle.jvmargs=.*/org.gradle.jvmargs=-Xmx5g -XX:+UseParallelGC -Dfile.encoding=UTF-8/' android/gradle.properties
          grep jvmargs android/gradle.properties
          ls -d /Applications/Xcode*.app
          # Compose Multiplatform needs the iOS 26 SDK: use the newest installed Xcode
          X=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          [ -n "$X" ] && sudo xcode-select -s "$X/Contents/Developer"
          xcodebuild -version

      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate

      - name: Compile shared Kotlin code for iOS
        working-directory: android
        run: |
          set -o pipefail
          ./gradlew :shared:compileKotlinIosSimulatorArm64 --console=plain 2>&1 | tee ../ios/kotlin-ios.log | grep -E '^e: |BUILD' || true
          grep -q 'BUILD SUCCESSFUL' ../ios/kotlin-ios.log

      # ---------- 2. device build → unsigned IPA ----------
      - name: Build for iPad (device, ${{ matrix.config }})
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild -project WonderLab.xcodeproj -scheme WonderLab -configuration ${{ matrix.config }} \
            -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath build/dev CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build 2>&1 | tee build-dev.log | grep -E 'error:|BUILD (SUCCEEDED|FAILED)|^e: ' || true
          test -d build/dev/Build/Products/${{ matrix.config }}-iphoneos/WonderLab.app

      - name: Package unsigned IPA
        working-directory: ios
        run: |
          test -f build/dev/Build/Products/${{ matrix.config }}-iphoneos/WonderLab.app/WonderLab
          mkdir -p out/Payload
          cp -R build/dev/Build/Products/${{ matrix.config }}-iphoneos/WonderLab.app out/Payload/
          cd out && zip -qry WonderLab-unsigned.ipa Payload && ls -la

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: WonderLab-${{ matrix.config }}-ipa
          path: ios/out/WonderLab-unsigned.ipa

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-build-logs-${{ matrix.config }}
          path: ios/*.log

      - name: Publish results to the ci-ios-results branch
        if: always()
        run: |
          set +e
          R=$RUNNER_TEMP/results; mkdir -p $R
                    for f in ios/*.log; do [ -f "$f" ] && grep -E -A3 '^e: |error:|warning: unable|Undefined symbol|duplicate symbol|ld: |referenced from|BUILD (SUCCEEDED|FAILED|SUCCESSFUL)|FAILURE|What went wrong' "$f" | head -600 > "$R/$(basename $f .log)-errors.txt"; done
          [ -f ios/out/WonderLab-unsigned.ipa ] && cp ios/out/WonderLab-unsigned.ipa $R/ && ls -la ios/out/WonderLab-unsigned.ipa > $R/ipa.txt
          echo "${{ github.sha }} ${{ job.status }} $(date -u)" > $R/RUN.txt
          cd $R && git init -q -b ci-ios-${{ matrix.config }} && git add -A && git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -qm "iOS ${{ matrix.config }} build for ${{ github.sha }}"
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" ci-ios-${{ matrix.config }}
