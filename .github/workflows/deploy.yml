name: Deploy (production)

# Manual only. Requires repository secrets:
#   CLOUDFLARE_API_TOKEN  – API token with "Edit Cloudflare Workers" + "D1 Edit" permissions
#   CLOUDFLARE_ACCOUNT_ID – the Cloudflare account id
# and (recommended) a "production" environment with required reviewers.
on:
  workflow_dispatch:
    inputs:
      apply_migrations:
        description: Apply pending D1 migrations before deploying
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npx eslint .
      - run: npx vitest run
      - run: npx vite build
      - name: Apply D1 migrations
        if: ${{ inputs.apply_migrations }}
        run: npx wrangler d1 migrations apply wonderlab --env production --remote
      - name: Deploy
        run: npx wrangler deploy --env production --message "${{ github.sha }}"
      - name: Smoke test
        run: |
          sleep 10
          curl -fsS https://learn.maheshglance.com/api/health | tee health.json
          grep -q '"ok":true' health.json
          curl -fsSI https://learn.maheshglance.com/ | grep -i content-security-policy
